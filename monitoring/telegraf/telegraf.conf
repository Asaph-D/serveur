# Telegraf — collecte AMI Asterisk → InfluxDB 2
# Variables : AMI_USER, AMI_PASSWORD, INFLUX_ORG, INFLUX_BUCKET, INFLUX_TOKEN
# Remplies par docker-compose (service telegraf, network_mode: host)

[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "freepbx"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# Image Docker Telegraf : pas de plugin asterisk ; script AMI → Influx line protocol.
[[inputs.exec]]
  commands = ["/usr/local/bin/ami_metrics.py"]
  timeout = "20s"
  data_format = "influx"
  interval = "10s"

[[inputs.exec]]
  commands = ["/usr/local/bin/log_metrics.py"]
  timeout = "20s"
  data_format = "influx"
  interval = "10s"
