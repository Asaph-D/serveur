; Files d'attente IVR — une queue par extension (1001-1010)
; Appliqué par : sudo bash scripts/apply-ivr-queues.sh
; Accès dialplan : 7101-7110 (direct) | 7010 (menu post-AGI) | 7020 (support global)

[phase3-support]
strategy=leastrecent
timeout=20
retry=2
wrapuptime=5
maxlen=0
ringinuse=no
joinempty=yes
leavewhenempty=no
musicclass=default
member => PJSIP/1001,0
member => PJSIP/1002,0
member => PJSIP/1003,0
member => PJSIP/1004,0
member => PJSIP/1005,0
member => PJSIP/1006,0
member => PJSIP/1007,0
member => PJSIP/1008,0
member => PJSIP/1009,0
member => PJSIP/1010,0

