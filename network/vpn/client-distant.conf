# PBX gestion : 192.168.137.240  (pbx.local)
# PBX VLAN 10 : 10.10.10.10
# IP publique site : 102.244.125.13
#
# Endpoint :
#   - À distance (Internet) : 102.244.125.13:51820  (défaut ci-dessous)
