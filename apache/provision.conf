# Mini-API provisionnement Asaphone
#
# /provision (sans slash) → index.php directement (pas de 301 http://pbx.local/provision/)
# indispensable pour trycloudflare + clients 4G (cloudflared envoie Host: pbx.local).
AliasMatch ^/provision$ /var/www/provision/index.php
Alias /provision/ /var/www/provision/

RedirectRelative On

<Directory /var/www/provision>
	Options -Indexes +FollowSymLinks
	AllowOverride None
	Require all granted
	<FilesMatch "\.php$">
		SetHandler application/x-httpd-php
	</FilesMatch>
</Directory>
