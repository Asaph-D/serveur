# Relais WebSocket → WireGuard (wstunnel). Exposé via Cloudflare trycloudflare → Apache :80.
ProxyRequests Off
ProxyTimeout 3600

<IfModule mod_proxy_wstunnel.c>
	<Location /wg-relay>
		ProxyPreserveHost Off
		ProxyPass ws://127.0.0.1:@RELAY_PORT@/
		ProxyPassReverse ws://127.0.0.1:@RELAY_PORT@/
	</Location>
</IfModule>

# Fallback HTTP (health / erreurs explicites hors upgrade WS)
<Location /wg-relay>
	Require all granted
</Location>
