# HTTPS FreePBX + mini-API /provision
# Certificat : /etc/asterisk/keys/ (Certman FreePBX, auto-signé ou LE)
# Activer : sudo bash scripts/enable-apache-https.sh

<VirtualHost *:443>
	ServerName pbx.local
	ServerAdmin admin@pbx.local

	# Redirections relatives si un client HTTPS atteint ce vhost directement
	RedirectRelative On

	DocumentRoot /var/www/html

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	SSLEngine on
	SSLCertificateFile      /etc/asterisk/keys/default.crt
	SSLCertificateKeyFile   /etc/asterisk/keys/default.key

	<FilesMatch "\.(?:cgi|shtml|phtml|php)$">
		SSLOptions +StdEnvVars
	</FilesMatch>
	<Directory /usr/lib/cgi-bin>
		SSLOptions +StdEnvVars
	</Directory>
</VirtualHost>
