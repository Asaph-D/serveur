; Asaphone — fwconsole chown : exceptions et permissions persistantes.
; Format : https://sangomakb.atlassian.net/wiki/spaces/FP/pages/10289397

[blacklist]
directory = /var/spool/asterisk/voicemail/
directory = /etc/asterisk/keys/

[custom]
rdir = /var/spool/asterisk/voicemail/,0775,asterisk,asterisk
rdir = /var/run/asterisk/,0775,www-data,asterisk
; Certman : owner www-data ; groupe asterisk = lecture clé par le démon (-G asterisk)
rdir = /etc/asterisk/keys/,2775,www-data,asterisk
file = /etc/asterisk/keys/ca.key,0640,www-data,asterisk
file = /etc/asterisk/keys/default.key,0640,www-data,asterisk
file = /etc/asterisk/keys/default.crt,0644,www-data,asterisk
file = /etc/asterisk/keys/default.pem,0644,www-data,asterisk
file = /etc/asterisk/keys/integration/certificate.pem,0644,www-data,asterisk
file = /etc/asterisk/keys/integration/webserver.key,0640,www-data,asterisk
file = /etc/asterisk/keys/integration/webserver.crt,0644,www-data,asterisk
