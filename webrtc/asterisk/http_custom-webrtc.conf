; Serveur HTTP(S) Asterisk pour WebSocket SIP (WebRTC).
; Le port TLS (8089) doit correspondre au transport [transport-wss] (protocol=wss).
;
; Certificats : par défaut ceux du Certificate Manager FreePBX (default).
; Si absents, créer un certificat dans Admin → Certificate Management ou ajuster les chemins.
;
; Inclus automatiquement par http.conf : #include http_custom.conf

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/default.crt
tlsprivatekey=/etc/asterisk/keys/default.key
