; WebSocket sécurisé (WSS) pour clients WebRTC dans le navigateur.
; Nécessite : http.conf avec TLS sur le même port (ex. 8089) — voir http_custom-webrtc.conf
; Inclus par FreePBX via pjsip.conf → pjsip.transports_custom_post.conf
;
; Après déploiement : sudo asterisk -rx "module reload res_pjsip.so"
; Vérification : sudo asterisk -rx "pjsip show transports"

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
allow_reload=yes
